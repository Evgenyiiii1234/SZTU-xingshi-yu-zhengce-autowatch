<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#131c2b"/>
      <stop offset="1" stop-color="#0d1a24"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d07a"/>
      <stop offset="0.5" stop-color="#7fd1ff"/>
      <stop offset="1" stop-color="#8b7dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#7fd1ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7fd1ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1b2634" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="230" fill="url(#bg)"/>
  <rect width="900" height="230" fill="url(#grid)" opacity="0.5"/>
  <rect width="900" height="230" fill="url(#glow)"/>

  <!-- 左侧装饰：播放键 -->
  <g transform="translate(64,66)">
    <circle cx="42" cy="42" r="41" fill="none" stroke="url(#line)" stroke-width="1.6" opacity="0.8"/>
    <circle cx="42" cy="42" r="30" fill="#0f1720" stroke="#243244"/>
    <path d="M35 29 L58 42 L35 55 Z" fill="#31d07a"/>
  </g>

  <text x="176" y="92" fill="#e8eef6" font-size="42" font-weight="700" letter-spacing="1">SZTU · 形势与政策</text>
  <text x="176" y="140" fill="#7fd1ff" font-size="26" font-weight="500" letter-spacing="4">自动观看视频 · 转写 · 总结</text>
  <text x="178" y="180" fill="#6f8399" font-size="15" letter-spacing="0.5">Tampermonkey 用户脚本（倍速伪装 / 进度打点） + faster-whisper 本地转写管线</text>

  <g font-size="12" fill="#0d1117" font-weight="600">
    <rect x="176" y="196" width="96" height="22" rx="11" fill="#31d07a" opacity="0.9"/>
    <text x="196" y="211">无依赖安装</text>
    <rect x="282" y="196" width="86" height="22" rx="11" fill="#7fd1ff" opacity="0.9"/>
    <text x="300" y="211">不需要 ffmpeg</text>
    <rect x="378" y="196" width="72" height="22" rx="11" fill="#8b7dff" opacity="0.9"/>
    <text x="397" y="211">MIT 开源</text>
  </g>

  <rect x="0" y="0" width="900" height="230" fill="none" stroke="#1f2b3a"/>
</svg>
