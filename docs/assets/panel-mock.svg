<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',-apple-system,sans-serif">
  <defs>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d07a"/><stop offset="1" stop-color="#7fd1ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="360" height="330" fill="#0d1117"/>
  <text x="12" y="16" fill="#3d4d5e" font-size="10" letter-spacing="1.5">界面示意</text>

  <!-- 面板 -->
  <g filter="url(#sh)">
    <rect x="16" y="26" width="328" height="288" rx="11" fill="#12161c" stroke="#2a3442"/>
    <!-- 标题栏 -->
    <path d="M16 37a11 11 0 0 1 11-11h306a11 11 0 0 1 11 11v17H16z" fill="#1a2230"/>
    <circle cx="32" cy="40" r="3.6" fill="#31d07a"/>
    <text x="44" y="44" fill="#7fd1ff" font-size="11.5" font-weight="700" letter-spacing="0.6">DFE 自动观看</text>
    <text x="300" y="44" fill="#5c748c" font-size="10">v1.2</text>
  </g>

  <!-- 进度 -->
  <text x="30" y="76" fill="#8fa6bd" font-size="10.5" font-family="ui-monospace,Consolas,monospace">12:41 / 46:08</text>
  <text x="300" y="76" fill="#8fa6bd" font-size="10.5" font-family="ui-monospace,Consolas,monospace">▶ 1x</text>
  <rect x="30" y="84" width="300" height="4" rx="2" fill="#0c1016"/>
  <rect x="30" y="84" width="82" height="4" rx="2" fill="url(#prog)"/>

  <!-- 行：倍率 -->
  <g font-size="11">
    <text x="30" y="112" fill="#8fa6bd">倍率</text>
    <rect x="66" y="100" width="52" height="18" rx="5" fill="#0c1016" stroke="#2a3442"/>
    <text x="78" y="113" fill="#e8eef6" font-family="ui-monospace,Consolas,monospace">8</text>

    <rect x="126" y="100" width="88" height="18" rx="5" fill="#1b6e46" stroke="#2a9c66"/>
    <text x="158" y="113" fill="#dbe8f5">应用</text>

    <rect x="222" y="100" width="108" height="18" rx="5" fill="#22303f" stroke="#33465c"/>
    <text x="252" y="113" fill="#dbe8f5">激进 ▾</text>
  </g>

  <!-- 行：接管 / 上报记录 -->
  <g font-size="11">
    <rect x="30" y="128" width="148" height="20" rx="5" fill="#22303f" stroke="#33465c"/>
    <text x="72" y="142" fill="#dbe8f5">接管播放</text>
    <rect x="186" y="128" width="144" height="20" rx="5" fill="#22303f" stroke="#33465c"/>
    <text x="216" y="142" fill="#dbe8f5">上报记录</text>
    <text x="290" y="142" fill="#7fd1ff" font-family="ui-monospace,Consolas,monospace">17</text>
  </g>

  <!-- 行：回放 / 导出 -->
  <g font-size="11">
    <rect x="30" y="156" width="148" height="20" rx="5" fill="#6e3a1b" stroke="#9c5f2a"/>
    <text x="80" y="170" fill="#ffd7b0">回放打点</text>
    <rect x="186" y="156" width="144" height="20" rx="5" fill="#22303f" stroke="#33465c"/>
    <text x="234" y="170" fill="#dbe8f5">导出记录</text>
  </g>

  <!-- 行：直链 / 清空 -->
  <g font-size="11">
    <rect x="30" y="184" width="148" height="20" rx="5" fill="#22303f" stroke="#33465c"/>
    <text x="66" y="198" fill="#dbe8f5">复制视频直链</text>
    <rect x="186" y="184" width="144" height="20" rx="5" fill="#22303f" stroke="#33465c"/>
    <text x="240" y="198" fill="#dbe8f5">清空</text>
  </g>

  <!-- 日志 -->
  <rect x="30" y="214" width="300" height="90" rx="6" fill="#0a0e13" stroke="#1d2632"/>
  <g font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#6f8399">
    <text x="38" y="230">14:02:11 脚本已就绪；模式 fast 倍率 8</text>
    <text x="38" y="244">14:02:12 接管: 初始</text>
    <text x="38" y="258">14:02:12 视频源: https://cdn…/a1b2.m3u8</text>
    <text x="38" y="272" fill="#31d07a">14:03:40 已录制上报请求 17 条</text>
    <text x="38" y="286" fill="#7fd1ff">14:04:02 播完，点击: 下一节</text>
    <text x="38" y="300" fill="#8fa6bd">14:04:05 接管: 切下一节</text>
  </g>

  <rect x="16" y="26" width="328" height="288" rx="11" fill="none" stroke="#1f2b3a"/>
</svg>
